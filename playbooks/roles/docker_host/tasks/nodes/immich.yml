---
- name: docker_host | node-immich | Create service directories
  ansible.builtin.file:
    path: "/{{ ansible_facts['user_id'] }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: model_cache
      mode: "0755"
    # postgres chmods its data dir to 0700 on startup; matching that here keeps
    # the task idempotent instead of resetting it to 0755 (and reporting
    # changed) on every run.
    - path: postgres
      mode: "0700"

- name: docker_host | node-immich | move docker-compose.yml file to host
  ansible.builtin.template:
    src: "immich/docker-compose.yml.j2"
    dest: "/{{ ansible_facts['user_id'] }}/docker-compose.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"

- name: docker_host | node-immich | move .env file to host
  ansible.builtin.template:
    src: "immich/env.j2"
    dest: "/{{ ansible_facts['user_id'] }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

# Mounted read-only at the path IMMICH_CONFIG_FILE points to in env.j2. It holds
# the whole system configuration, not just the OIDC section, because Immich
# treats the file as complete and defaults anything it omits.
- name: docker_host | node-immich | move immich-config.json to host
  ansible.builtin.template:
    src: "immich/immich-config.json.j2"
    dest: "/{{ ansible_facts['user_id'] }}/immich-config.json"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

# The sync image runs as its node user (UID/GID 1000). The bind mount is owned
# by the same IDs so the container can read config.json and write store.json.
- name: docker_host | node-immich | validate person-to-album configuration
  ansible.builtin.assert:
    that:
      - (immich_person_album_jobs | default([])) | length > 0
    fail_msg: >-
      Add at least one entry to immich_person_album_jobs in host_vars/immich.
  when: immich_person_album_enabled | default(false)

- name: docker_host | node-immich | validate person-to-album jobs
  ansible.builtin.assert:
    that:
      - item.description | default('') | length > 0
      - item.person_id | length > 0
      - item.album_id | length > 0
      - item.api_key_name in (immich_person_album_api_keys | default({}))
      - ((immich_person_album_api_keys | default({})).get(item.api_key_name, '')) | length > 0
      - ((immich_person_album_api_keys | default({})).get(item.api_key_name, '')) != 'changeme'
    fail_msg: >-
      Job "{{ item.description | default(item.api_key_name) }}": set person_id
      and album_id in host_vars/immich, and give api_key_name a real entry in
      immich_person_album_api_keys. The API key needs asset.read and
      albumAsset.create.
  loop: "{{ immich_person_album_jobs | default([]) }}"
  loop_control:
    label: "{{ item.description | default(item.api_key_name) }}"
  when: immich_person_album_enabled | default(false)

- name: docker_host | node-immich | create person-to-album data directory
  ansible.builtin.file:
    path: "/{{ ansible_facts['user_id'] }}/person_to_album"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: immich_person_album_enabled | default(false)

- name: docker_host | node-immich | move person-to-album config to host
  ansible.builtin.template:
    src: "immich/person-to-album-config.json.j2"
    dest: "/{{ ansible_facts['user_id'] }}/person_to_album/config.json"
    owner: "1000"
    group: "1000"
    mode: "0600"
  when: immich_person_album_enabled | default(false)
  notify: recreate immich-person-to-album

# Do not leave the API key on disk after the integration is switched off. The
# data directory stays so store.json survives a temporary disable.
- name: docker_host | node-immich | remove person-to-album config when disabled
  ansible.builtin.file:
    path: "/{{ ansible_facts['user_id'] }}/person_to_album/config.json"
    state: absent
  when: not (immich_person_album_enabled | default(false))


- name: docker_host | node-immich | deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "/{{ ansible_facts['user_id'] }}/"
    remove_orphans: true
    files:
      - docker-compose.yml
