---
- name: docker_host | node-docker | Create service directories
  ansible.builtin.file:
    path: "/{{ ansible_facts['user_id'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - homepage
    - speedtest
    - signal-cli
    - alertmanager-signal
    - caddy
    - caddy/data
    - caddy/config
    - promtail
    - WatchYourLAN
    - homelable
    - gatus
    - registry

# Homepage's Kubernetes widget runs outside the cluster, so "default" mode
# needs a kubeconfig on disk. Copy the control-plane admin.conf here and let
# the compose template mount it read-only. The stat/slurp are delegated so a
# run limited to the docker host still has the file available after the first
# cluster bootstrap; before the cluster exists they are skipped and the widget
# renders as disabled instead of failing.
- name: docker_host | node-docker | Check for a control-plane kubeconfig
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['kubernetes_control'][0] }}"
  when: groups['kubernetes_control'] | default([]) | length > 0
  register: docker_host_kubeconfig
  no_log: true

- name: docker_host | node-docker | Read the control-plane kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['kubernetes_control'][0] }}"
  when:
    - groups['kubernetes_control'] | default([]) | length > 0
    - docker_host_kubeconfig.stat.exists
  register: docker_host_kubeconfig_content
  no_log: true

- name: docker_host | node-docker | Install kubeconfig for Homepage
  ansible.builtin.copy:
    content: "{{ docker_host_kubeconfig_content.content | b64decode }}"
    dest: "/{{ ansible_facts['user_id'] }}/homepage/kubeconfig"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  when:
    - groups['kubernetes_control'] | default([]) | length > 0
    - docker_host_kubeconfig.stat.exists
  no_log: true
  notify: recreate docker stack

- name: docker_host | node-docker | Record Homepage kubeconfig availability
  ansible.builtin.set_fact:
    homepage_kubeconfig_exists: true
  when:
    - groups['kubernetes_control'] | default([]) | length > 0
    - docker_host_kubeconfig.stat.exists

- name: docker_host | node-docker | Move promtail-config.yml
  ansible.builtin.template:
    src: common/promtail-config.yml.j2
    dest: "/{{ ansible_facts['user_id'] }}/promtail/promtail-config.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

- name: docker_host | node-docker | move docker-compose.yml file to host
  ansible.builtin.template:
    src: "docker/docker-compose.yml.j2"
    dest: "/{{ ansible_facts['user_id'] }}/docker-compose.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"

- name: docker_host | node-docker | Move alertmanager-signal/config.yaml
  ansible.builtin.template:
    src: "docker/alertmanager-signal/config.yaml.j2"
    dest: "/{{ ansible_facts['user_id'] }}/alertmanager-signal/config.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

- name: docker_host | node-docker | Move caddy Dockerfile
  ansible.builtin.copy:
    src: "docker/caddy/"
    dest: "/{{ ansible_facts['user_id'] }}/caddy/"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"

- name: docker_host | node-docker | Move caddy/Caddyfile
  ansible.builtin.template:
    src: "docker/caddy/Caddyfile.j2"
    dest: "/{{ ansible_facts['user_id'] }}/caddy/Caddyfile"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

# Caddy is a custom xcaddy build (porkbun DNS, rate limiting), so only a binary
# carrying those modules can judge the Caddyfile. Building first means a config
# using a newly added module is checked against an image that has it, rather
# than against the older one still running. `docker compose up` on its own does
# not rebuild after a Dockerfile change.
#
# Reported unchanged because the image alone changes nothing that is serving
# traffic; the deploy task below is what recreates the container.
- name: docker_host | node-docker | Build the caddy image
  ansible.builtin.command:
    cmd: docker compose build caddy
    chdir: "/{{ ansible_facts['user_id'] }}/"
  register: caddy_build
  changed_when: false

# The doubled "caddy" is not a typo: the first is the compose service, the
# second is the binary. The upstream image sets no ENTRYPOINT, so the arguments
# given here replace its whole CMD rather than being appended to one.
#
# `run` rather than `exec`: it works whether or not Caddy is currently up, and
# it uses the image just built instead of the process still serving the old
# config. A syntax error stops the play here, before the deploy below recreates
# anything, so the running instance keeps serving its in-memory config.
- name: docker_host | node-docker | Validate caddy/Caddyfile
  ansible.builtin.command:
    cmd: docker compose run --rm --no-deps caddy caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
    chdir: "/{{ ansible_facts['user_id'] }}/"
  register: caddy_validate
  changed_when: false

- name: docker_host | node-docker | Move homepage config files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/{{ ansible_facts['user_id'] }}/homepage/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  loop: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/templates/docker/homepage/*.j2', wantlist=True) }}"
  notify: recreate docker stack

- name: docker_host | node-docker | Move homelable .env file
  ansible.builtin.template:
    src: "docker/homelable/.env.j2"
    dest: "/{{ ansible_facts['user_id'] }}/homelable/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

- name: docker_host | node-docker | Move gatus/config.yaml
  ansible.builtin.template:
    src: "docker/gatus/config.yaml.j2"
    dest: "/{{ ansible_facts['user_id'] }}/gatus/config.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

- name: docker_host | node-docker | Move registry htpasswd file
  ansible.builtin.copy:
    dest: "/{{ ansible_facts['user_id'] }}/registry/htpasswd"
    content: "{{ registry_auth_username }}:{{ registry_auth_password_hash }}\n"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  notify: recreate docker stack

- name: docker_host | node-docker | deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "/{{ ansible_facts['user_id'] }}/"
    remove_orphans: true
    files:
      - docker-compose.yml

# Marks the hub as refreshed for this run, so the "Sync monitoring hub" play in
# playbook.yml knows it does not need to run these tasks a second time.
- name: docker_host | node-docker | mark monitoring hub as synced for this run
  ansible.builtin.set_fact:
    monitoring_hub_synced: true
