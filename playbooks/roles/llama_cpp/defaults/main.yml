---
# GPU backend for the llama.cpp container image. Both variants come from the
# same upstream build:
#   vulkan  Mesa/RADV, needs only /dev/dri. The right default on an image-based
#           desktop such as Bazzite, where nothing extra can be layered in
#           without a rebuild and reboot.
#   rocm    AMD's compute stack, additionally needs /dev/kfd. Faster for some
#           models, but the image must have been built for the card's LLVM
#           target (gfx1201 for RDNA4); set llama_rocm_gfx_override when it was
#           not.
llama_backend: vulkan

llama_image_build: b10156
llama_image: "ghcr.io/ggml-org/llama.cpp:server-{{ llama_backend }}-{{ llama_image_build }}"

llama_backend_devices:
  vulkan:
    - /dev/dri
  rocm:
    - /dev/dri
    - /dev/kfd
llama_devices: "{{ llama_backend_devices[llama_backend] }}"

# Pretend to be a different gfx target so ROCm loads its nearest kernels.
# Ignored when llama_backend is vulkan. Empty means "do not set it".
llama_rocm_gfx_override: ""

# Model to serve, in llama-server's -hf form (<hf-repo>:<quant>). It is
# downloaded on first start and cached in llama_cache_dir, so a restart does
# not re-fetch it.
llama_model: "unsloth/Qwen3-14B-GGUF:Q4_K_M"

llama_listen_address: "0.0.0.0"
llama_port: 8080

# Context is the second-largest consumer of VRAM after the weights themselves:
# Qwen3-14B at Q4_K_M is roughly 9 GB, and its KV cache costs about 160 KB per
# token, so 16k tokens adds another ~2.6 GB. Raising this on a 16 GB card needs
# a quantised KV cache (--cache-type-k q8_0 --cache-type-v q8_0) via
# llama_extra_args, or layers start spilling to system RAM.
llama_context_size: 16384

# 99 means "all of them"; llama.cpp clamps to the model's layer count.
llama_gpu_layers: 99

# Appended verbatim to the llama-server command line.
llama_extra_args: []

llama_cache_dir: /var/lib/llama.cpp
llama_quadlet_dir: /etc/containers/systemd
llama_service_name: llama-server

# Open the inference port so Open WebUI on the llm node can reach it. Skipped
# when firewalld is not running.
llama_open_firewall: true

# Confirm the server actually answers before the play reports success. Quadlet
# units are Type=notify and podman signals ready as soon as the container
# starts, which is long before llama-server has fetched the weights and bound
# its port, so systemd alone cannot tell a working server from a crash loop.
# The defaults allow 30 minutes, matching the unit's TimeoutStartSec, since a
# first run downloads the whole model.
llama_wait_for_ready: true
llama_ready_retries: 60
llama_ready_delay: 30
