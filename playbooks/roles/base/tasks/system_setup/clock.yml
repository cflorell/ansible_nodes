---
- name: system setup | clock | install timesync package
  tags: ntp,system setup
  ansible.builtin.package:
    name: "{{ clock_package }}"
  retries: 3
  delay: 3
  register: result
  until: result is succeeded
  when: ansible_facts['distribution'] not in ['Archlinux']  # Already has it installed

- name: system setup | clock | start and enable systemd-timesyncd
  tags: ntp,system settings
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true
  when:
    - ansible_facts['distribution'] in ['Ubuntu', 'Debian', 'Archlinux']
    # systemd-timesyncd carries ConditionVirtualization=!container, so systemd
    # skips it inside containers (the LXC docker hosts): `systemctl start`
    # succeeds without ever activating the unit, so `state: started` reported
    # changed on every run. Containers take the host's clock anyway. This
    # mirrors systemd's own condition via Ansible's virtualization fact.
    - "'container' not in (ansible_facts['virtualization_tech_guest'] | default([]))"

- name: system setup | clock | start and enable chrony
  tags: ntp,system settings
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  when: ansible_facts['distribution'] in ["Fedora"]

- name: system setup | clock | set time zone
  tags: ntp,timezone,system setup
  community.general.timezone:
    name: Europe/Stockholm
